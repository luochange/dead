name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管运行器已预装 Android SDK；缺什么就地补什么，
      # 不依赖第三方 setup action（它在 ubuntu-24.04 上不稳定）。
      - name: Ensure Android SDK 34
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SM=$(find "$SDK" -name sdkmanager -type f | head -1)
            echo "sdkmanager=$SM"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Cache Gradle & Robolectric
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
